<style>
  :root {
    --cream: #faf4e4;
    --cream-2: #f5ecd1;
    --ink: #15140f;
    --ink-2: #34322a;
    --ink-3: #6a6657;
    --rule: #1a1812;
    /* Section accents */
    --mint: #34c47a;
    --mint-deep: #186b3d;
    --mint-soft: #d6f1de;
    --coral: #f06a3a;
    --coral-deep: #a13413;
    --coral-soft: #fbdcc8;
    --blue: #3a6cff;
    --blue-deep: #1e3a99;
    --blue-soft: #d8e1ff;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: "DM Sans", system-ui, sans-serif;
    font-size: 18px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .display {
    font-family: "Bricolage Grotesque", "DM Sans", sans-serif;
    font-weight: 800;
    letter-spacing: -0.025em;
    line-height: 0.95;
  }
  .mono { font-family: "DM Mono", ui-monospace, monospace; }

  /* ─── Top progress strip ─── */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--ink); color: var(--cream);
    padding: 12px 24px;
    display: flex; align-items: center; gap: 16px;
    font-family: "DM Mono", monospace;
    font-size: 12px; letter-spacing: 0.04em;
  }
  .topbar .lbl { white-space: nowrap; }
  .topbar .pips { display: flex; gap: 6px; flex: 1; }
  .topbar .pip {
    flex: 1; height: 10px; border-radius: 999px;
    background: rgba(255,255,255,0.16);
    overflow: hidden; position: relative;
  }
  .topbar .pip .fill {
    position: absolute; inset: 0 auto 0 0;
    background: var(--c, var(--mint));
    transition: width 320ms cubic-bezier(.4,1.4,.4,1);
  }
  .topbar .count { color: var(--cream); font-weight: 500; white-space: nowrap; }

  .wrap { max-width: 880px; margin: 0 auto; padding: 0 24px 120px; }

  /* ─── Hero ─── */
  .hero { padding: 60px 0 56px; position: relative; }
  .hero .eyebrow {
    display: inline-block;
    background: var(--ink); color: var(--cream);
    padding: 8px 14px; border-radius: 999px;
    font-family: "DM Mono", monospace;
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    font-weight: 500;
    margin-bottom: 28px;
    white-space: nowrap;
  }
  .hero h1 {
    font-size: clamp(40px, 9vw, 104px);
    margin: 0 0 24px;
    color: var(--ink);
    text-wrap: balance;
    overflow-wrap: break-word;
  }
  .hero h1 .amount {
    display: inline-block;
    background: var(--mint);
    color: var(--ink);
    padding: 4px 22px 12px;
    border: 3px solid var(--ink);
    border-radius: 18px;
    box-shadow: 6px 6px 0 var(--ink);
    transform: rotate(-2deg);
    margin: 0 4px;
    line-height: 1;
    white-space: nowrap;
    overflow-wrap: normal;
    word-break: keep-all;
  }
  .hero .lede {
    font-size: 22px;
    line-height: 1.45;
    color: var(--ink-2);
    max-width: 38ch;
    margin: 0 0 32px;
    text-wrap: pretty;
  }
  .hero .lede strong { color: var(--ink); }

  .hero .quickfacts {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 8px;
    max-width: 680px;
  }
  .hero .quickfacts .qf {
    border: 2px solid var(--ink);
    border-radius: 14px;
    background: var(--cream);
    padding: 14px 16px;
  }
  .hero .quickfacts .qf .v {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    font-size: 28px;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--ink);
  }
  .hero .quickfacts .qf .l {
    font-size: 13px; color: var(--ink-3);
    margin-top: 4px; font-weight: 500;
  }

  /* ─── Hero growth chart ─── */
  .growth-chart {
    margin-top: 18px;
    max-width: 680px;
    border: 2.5px solid var(--ink);
    border-radius: 18px;
    background: var(--cream);
    padding: 22px 26px 20px;
    box-shadow: 6px 6px 0 var(--ink);
  }
  .gc-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; margin-bottom: 22px; flex-wrap: wrap;
  }
  .gc-eyebrow {
    font-family: "DM Mono", monospace;
    font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 600;
    display: flex; align-items: center; gap: 10px;
  }
  .gc-eyebrow .pill {
    background: var(--ink); color: var(--mint);
    padding: 3px 9px; border-radius: 6px;
    letter-spacing: 0.08em;
  }
  .gc-headline {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 700; font-size: 18px;
    color: var(--ink); letter-spacing: -0.015em;
    line-height: 1.2;
  }
  .gc-headline em {
    font-style: normal; font-weight: 800;
    color: var(--blue);
    background: var(--blue-soft);
    padding: 2px 8px;
    border-radius: 6px;
    border: 1.5px solid var(--blue);
  }

  .gc-bars {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    align-items: end;
    height: 200px;
    border-bottom: 2.5px solid var(--ink);
    position: relative;
  }
  .gc-col {
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
    height: 100%;
    position: relative;
    min-width: 0;
  }
  .gc-amt {
    font-family: "DM Mono", monospace;
    font-size: 11px; color: var(--ink-2); font-weight: 600;
    margin-bottom: 6px;
    white-space: nowrap;
    text-align: center;
  }
  .gc-bar {
    width: 100%;
    background: var(--mint);
    border: 2px solid var(--ink);
    border-bottom: none;
    border-radius: 7px 7px 0 0;
    transition: height 600ms cubic-bezier(.34,1.4,.4,1);
    flex-shrink: 0;
  }
  .gc-col:last-child .gc-bar { background: var(--blue); }
  .gc-col:last-child .gc-amt {
    color: var(--ink);
    background: var(--blue);
    color: var(--cream);
    padding: 3px 8px;
    border-radius: 5px;
    font-weight: 700;
  }

  .gc-labels {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    margin-top: 8px;
  }
  .gc-label {
    text-align: center;
    font-family: "DM Mono", monospace;
    font-size: 11px;
    color: var(--ink-3);
    font-weight: 500;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .gc-col:last-of-type ~ .gc-labels .gc-label:last-child,
  .gc-labels .gc-label:last-child { color: var(--blue); font-weight: 700; }

  .gc-footnote {
    margin-top: 14px;
    font-size: 12.5px;
    color: var(--ink-3);
    font-style: italic;
    line-height: 1.5;
  }
  .gc-footnote strong { color: var(--ink-2); font-weight: 600; font-style: normal; }


  /* Sticker decoration */
  .sticker {
    position: absolute;
    background: var(--coral);
    color: var(--ink);
    border: 3px solid var(--ink);
    padding: 12px 18px;
    border-radius: 14px;
    box-shadow: 4px 4px 0 var(--ink);
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: -0.01em;
    line-height: 1;
    text-transform: uppercase;
    transform: rotate(8deg);
    z-index: 1;
  }
  .hero .sticker-1 {
    top: 14px; right: -8px;
    background: var(--blue); color: var(--cream);
  }
  .hero .sticker-2 {
    bottom: 24px; right: 24px;
    background: var(--coral);
    transform: rotate(-6deg);
  }
  /* Hide stickers below ~960px where they tend to collide with the headline */
  @media (max-width: 960px) {
    .hero .sticker-1, .hero .sticker-2 { display: none; }
  }

  /* ─── What this is ─── */
  .blurb {
    background: var(--ink);
    color: var(--cream);
    border-radius: 28px;
    padding: 36px 36px;
    margin-bottom: 80px;
    position: relative;
  }
  .blurb h2 {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    font-size: 32px;
    margin: 0 0 14px;
    color: var(--mint);
    letter-spacing: -0.02em;
  }
  .blurb p { font-size: 19px; line-height: 1.55; margin: 0 0 12px; color: var(--cream); opacity: 0.92; }
  .blurb p:last-child { margin-bottom: 0; }
  .blurb p strong { color: var(--mint); font-weight: 700; }

  /* ─── Section / Chapter ─── */
  .section {
    position: relative;
    margin: 0 0 32px;
    border: 3px solid var(--ink);
    border-radius: 28px;
    background: var(--cream);
    overflow: hidden;
    transition: box-shadow 200ms ease;
  }
  .section.s1 { background: var(--mint-soft); }
  .section.s2 { background: var(--coral-soft); }
  .section.s3 { background: var(--blue-soft); }
  .section.done { box-shadow: 8px 8px 0 var(--ink); }

  .section-head {
    padding: 28px 32px 16px;
    position: relative;
    display: flex; gap: 24px; align-items: flex-start;
  }

  .step-badge {
    flex: 0 0 auto;
    background: var(--accent);
    color: var(--cream);
    border: 3px solid var(--ink);
    border-radius: 18px;
    padding: 14px 22px 18px;
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    text-align: center;
    box-shadow: 4px 4px 0 var(--ink);
    transform: rotate(-3deg);
    min-width: 110px;
  }
  .step-badge .lbl { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; line-height: 1; margin-bottom: 2px; opacity: 0.9; }
  .step-badge .n {
    font-size: 64px; line-height: 1;
    letter-spacing: -0.03em;
  }
  .step-badge .of { font-size: 13px; letter-spacing: 0.06em; opacity: 0.85; margin-top: 2px; }

  .section.s1 { --accent: var(--mint); --accent-deep: var(--mint-deep); }
  .section.s2 { --accent: var(--coral); --accent-deep: var(--coral-deep); }
  .section.s3 { --accent: var(--blue); --accent-deep: var(--blue-deep); }

  .head-text { flex: 1; padding-top: 6px; }
  .head-text .kicker {
    font-family: "DM Mono", monospace;
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--accent-deep); font-weight: 500;
    margin-bottom: 6px;
  }
  .head-text h2 {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    font-size: clamp(36px, 5vw, 48px);
    letter-spacing: -0.025em;
    line-height: 1;
    margin: 0 0 12px;
    color: var(--ink);
    text-wrap: balance;
  }
  .head-text .est {
    display: inline-block;
    background: var(--cream);
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 13px;
    font-family: "DM Mono", monospace;
    color: var(--ink);
    font-weight: 500;
    white-space: nowrap;
  }

  .section-body {
    padding: 8px 32px 32px;
  }
  .section-body p.lead {
    font-size: 19px; line-height: 1.55;
    color: var(--ink-2);
    margin: 12px 0 24px;
    max-width: 56ch;
    text-wrap: pretty;
  }
  .section-body p.lead strong { color: var(--ink); font-weight: 700; }

  /* Task list - big satisfying checkboxes */
  .tasks {
    list-style: none; padding: 0; margin: 0;
  }
  .tasks li {
    display: flex; gap: 18px;
    padding: 18px 0;
    border-top: 2px dashed rgba(0,0,0,0.12);
    cursor: pointer;
    align-items: flex-start;
  }
  .tasks li:first-child { border-top: 2px solid var(--ink); }
  .tasks li:last-child { border-bottom: 2px solid var(--ink); }

  .check {
    flex: 0 0 38px;
    width: 38px; height: 38px;
    background: var(--cream);
    border: 2.5px solid var(--ink);
    border-radius: 50%;
    margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    transition: transform 180ms cubic-bezier(.4,1.6,.4,1), background 160ms ease;
    position: relative;
  }
  .tasks li:hover .check { transform: scale(1.06); }
  .tasks li.checked .check {
    background: var(--accent);
    transform: scale(1.04);
  }
  .check svg { opacity: 0; transition: opacity 140ms ease 60ms; }
  .tasks li.checked .check svg { opacity: 1; }

  .task-body { flex: 1; padding-top: 2px; }
  .task-body .t {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 700;
    font-size: 20px;
    color: var(--ink);
    line-height: 1.2;
    letter-spacing: -0.01em;
  }
  .tasks li.checked .task-body .t {
    color: var(--ink-3);
    text-decoration: line-through;
    text-decoration-thickness: 2px;
    text-decoration-color: var(--ink-3);
  }
  .task-body .hint {
    margin-top: 6px;
    color: var(--ink-2);
    font-size: 16px;
    line-height: 1.5;
  }

  /* Heads-up / warning callouts inside section */
  .heads {
    margin-top: 22px;
    background: var(--cream);
    border: 2px solid var(--ink);
    border-radius: 14px;
    padding: 16px 18px;
    box-shadow: 4px 4px 0 var(--ink);
  }
  .heads .lbl {
    display: inline-block;
    background: var(--ink);
    color: var(--accent);
    padding: 3px 10px;
    border-radius: 6px;
    font-family: "DM Mono", monospace;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    font-weight: 500;
    margin-bottom: 10px;
    white-space: nowrap;
  }
  .heads p { margin: 0; font-size: 16.5px; line-height: 1.5; color: var(--ink); }
  .heads p strong { font-weight: 700; }

  /* "Buy this" recommendation card */
  .recommend {
    margin-top: 22px;
    background: var(--ink);
    color: var(--cream);
    border-radius: 18px;
    padding: 24px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 14px;
    align-items: center;
  }
  .recommend .lbl { font-family: "DM Mono", monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mint); font-weight: 500; }
  .recommend .ticker {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    font-size: 56px;
    letter-spacing: -0.04em;
    line-height: 1;
    color: var(--cream);
    margin: 4px 0;
  }
  .recommend .fname { color: var(--cream); opacity: 0.78; font-size: 15px; }
  .recommend .fee {
    text-align: right;
    border-left: 1px solid rgba(255,255,255,0.2);
    padding-left: 18px;
  }
  .recommend .fee .v {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800; font-size: 32px;
    color: var(--mint);
    line-height: 1;
  }
  .recommend .fee .l { font-size: 12px; opacity: 0.7; margin-top: 4px; font-family: "DM Mono", monospace; letter-spacing: 0.08em; text-transform: uppercase; }

  .alt-funds {
    margin-top: 14px;
    padding: 14px 18px;
    background: rgba(0,0,0,0.04);
    border-radius: 12px;
    border: 2px solid rgba(0,0,0,0.12);
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    font-size: 14px; color: var(--ink-2);
  }
  .alt-funds .l {
    font-family: "DM Mono", monospace;
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 500;
  }
  .alt-funds .alt {
    background: var(--cream);
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    padding: 4px 12px;
    font-family: "DM Mono", monospace;
    font-weight: 500;
    color: var(--ink);
    font-size: 13px;
  }
  .alt-funds .alt span { color: var(--ink-3); margin-left: 8px; }

  /* DONE stamp that appears on complete sections */
  .done-stamp {
    position: absolute;
    top: 18px; right: 24px;
    background: var(--ink);
    color: var(--cream);
    border: 3px solid var(--ink);
    padding: 10px 18px;
    border-radius: 14px;
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 0.04em;
    transform: rotate(8deg) scale(0);
    box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
    transition: transform 280ms cubic-bezier(.34,1.8,.4,1);
    z-index: 2;
    pointer-events: none;
  }
  .section.done .done-stamp {
    transform: rotate(8deg) scale(1);
  }

  /* ─── Growth section ─── */
  .growth {
    margin: 80px 0 0;
    background: var(--ink);
    color: var(--cream);
    border-radius: 28px;
    padding: 48px 36px 40px;
    position: relative;
    overflow: hidden;
  }
  .growth::before {
    content: "";
    position: absolute;
    top: -100px; right: -100px;
    width: 280px; height: 280px;
    background: var(--mint);
    opacity: 0.18;
    border-radius: 50%;
    pointer-events: none;
  }
  .growth .kicker {
    font-family: "DM Mono", monospace;
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--mint);
    margin-bottom: 10px;
  }
  .growth h2 {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    font-size: clamp(36px, 6vw, 56px);
    letter-spacing: -0.025em;
    line-height: 1;
    margin: 0 0 14px;
    color: var(--cream);
    max-width: 18ch;
    text-wrap: balance;
  }
  .growth h2 em { color: var(--mint); font-style: normal; }
  .growth .sub {
    font-size: 16px;
    color: var(--cream); opacity: 0.7;
    max-width: 50ch;
    margin: 0 0 32px;
  }

  .ages {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .age {
    background: rgba(255,255,255,0.06);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 18px;
    padding: 20px 22px 24px;
    position: relative;
    overflow: hidden;
  }
  .age .when {
    font-family: "DM Mono", monospace;
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--mint);
  }
  .age .amt {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    font-size: clamp(40px, 5.5vw, 60px);
    letter-spacing: -0.03em;
    line-height: 1;
    color: var(--cream);
    margin: 8px 0 6px;
  }
  .age .amt .cur { color: var(--mint); font-size: 0.55em; vertical-align: top; margin-right: 2px; font-weight: 700; }
  .age .what { color: var(--cream); opacity: 0.78; font-size: 14px; line-height: 1.4; }

  .growth .note {
    margin-top: 24px;
    font-size: 13px; color: var(--cream); opacity: 0.55;
    line-height: 1.55;
    max-width: 60ch;
  }

  /* ─── FAQ ─── */
  .faq { margin-top: 80px; }
  .faq .kicker {
    display: inline-block;
    background: var(--blue);
    color: var(--cream);
    padding: 6px 14px;
    border-radius: 999px;
    border: 2px solid var(--ink);
    font-family: "DM Mono", monospace;
    font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
    margin-bottom: 20px;
    font-weight: 500;
    transform: rotate(-2deg);
  }
  .faq h2 {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    font-size: clamp(36px, 6vw, 56px);
    letter-spacing: -0.025em;
    line-height: 1;
    margin: 0 0 28px;
  }
  .faq details {
    background: var(--cream);
    border: 2.5px solid var(--ink);
    border-radius: 16px;
    padding: 18px 22px;
    margin-bottom: 14px;
  }
  .faq details[open] { background: var(--cream-2); }
  .faq summary {
    cursor: pointer; list-style: none;
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 700;
    font-size: 19px;
    color: var(--ink);
    letter-spacing: -0.01em;
    display: flex; justify-content: space-between; gap: 16px;
    align-items: center;
  }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after {
    content: "+";
    width: 28px; height: 28px;
    background: var(--ink); color: var(--cream);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 500;
    flex: 0 0 28px;
    transition: transform 200ms ease;
  }
  .faq details[open] summary::after { content: "−"; transform: rotate(180deg); }
  .faq details p {
    margin: 14px 0 0;
    color: var(--ink-2);
    font-size: 16.5px; line-height: 1.55;
  }

  /* ─── Footer ─── */
  footer {
    margin-top: 80px;
    padding: 28px 0 0;
    border-top: 2px solid var(--ink);
    font-size: 14px;
    color: var(--ink-3);
    line-height: 1.6;
  }
  footer p { margin: 4px 0; }

  .reset {
    margin-top: 24px;
    background: var(--cream);
    border: 2px solid var(--ink);
    color: var(--ink);
    font-family: "DM Mono", monospace;
    font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 10px 18px;
    border-radius: 999px;
    cursor: pointer;
    font-weight: 500;
  }
  .reset:hover { background: var(--ink); color: var(--cream); }

  /* All-done celebration banner */
  .celebrate {
    position: relative;
    margin: 24px 0 0;
    background: var(--mint);
    border: 3px solid var(--ink);
    border-radius: 24px;
    padding: 28px 32px;
    box-shadow: 8px 8px 0 var(--ink);
    overflow: hidden;
    display: none;
  }
  .celebrate.show { display: block; animation: pop 380ms cubic-bezier(.34,1.7,.4,1); }
  @keyframes pop {
    from { transform: scale(0.92); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .celebrate h3 {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    font-size: 36px;
    line-height: 1;
    margin: 0 0 8px;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .celebrate p { margin: 0; font-size: 17px; color: var(--ink); max-width: 50ch; }

  /* Responsive */
  @media (max-width: 720px) {
    .wrap { padding: 0 16px 80px; }
    .hero { padding: 36px 0 36px; }
    .hero .sticker-1, .hero .sticker-2 { display: none; }
    .hero h1 .amount { padding: 4px 14px 8px; box-shadow: 4px 4px 0 var(--ink); }
    .hero .quickfacts { grid-template-columns: 1fr; }
    .growth-chart { padding: 18px 18px 16px; }
    .gc-headline { font-size: 16px; }
    .gc-bars { height: 130px; gap: 5px; }
    .gc-labels { gap: 5px; }
    .gc-amt { font-size: 10px; margin-bottom: 4px; }
    .gc-label { font-size: 10px; }
    .gc-col:last-child .gc-amt { padding: 2px 5px; font-size: 10px; }
    .blurb { padding: 28px 22px; border-radius: 22px; margin-bottom: 56px; }
    .section { border-radius: 22px; }
    .section-head { padding: 22px 20px 12px; flex-direction: column; gap: 16px; }
    .step-badge { transform: rotate(-3deg) translateX(-4px); align-self: flex-start; }
    .section-body { padding: 4px 20px 24px; }
    .recommend { grid-template-columns: 1fr; padding: 22px; }
    .recommend .fee { border-left: none; border-top: 1px solid rgba(255,255,255,0.2); padding: 14px 0 0; text-align: left; display: flex; gap: 12px; align-items: baseline; }
    .alt-funds { flex-direction: column; align-items: stretch; gap: 8px; padding: 12px 14px; }
    .alt-funds .alt { display: flex; justify-content: space-between; padding: 8px 12px; }
    .alt-funds .alt span { margin-left: 0; }
    .ages { grid-template-columns: 1fr; }
    .growth { padding: 32px 22px; border-radius: 22px; }
    .done-stamp { font-size: 16px; padding: 8px 14px; top: 12px; right: 16px; }
    .topbar { padding: 10px 14px; gap: 10px; font-size: 11px; }
    .topbar .lbl { display: none; }
    .topbar .count { white-space: nowrap; font-size: 11px; }
    .topbar .pips { min-width: 60px; }
    .pdf-btn { padding: 6px 10px; font-size: 11px; }
    .pdf-btn svg { width: 12px; height: 12px; }
    .pdf-help { right: 14px; left: 14px; max-width: none; }
    .pdf-help::before { right: 24px; }
    .celebrate { padding: 22px 22px; }
    .celebrate h3 { font-size: 28px; }
  }

  /* Debug: force mobile styles regardless of viewport width.
     Toggle with: document.documentElement.classList.toggle('preview-mobile') */
  html.preview-mobile body {
    max-width: 414px;
    margin: 0 auto;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.1);
    min-height: 100vh;
  }
  html.preview-mobile .wrap { padding: 0 16px 80px; }
  html.preview-mobile .hero { padding: 36px 0 36px; }
  html.preview-mobile .hero .sticker-1, html.preview-mobile .hero .sticker-2 { display: none; }
  html.preview-mobile .hero h1 .amount { padding: 4px 14px 8px; box-shadow: 4px 4px 0 var(--ink); }
  html.preview-mobile .hero .quickfacts { grid-template-columns: 1fr; }
  html.preview-mobile .growth-chart { padding: 18px 18px 16px; }

  /* ─── Save-as-PDF button in topbar ─── */
  .pdf-btn {
    background: var(--mint);
    color: var(--ink);
    border: 2px solid var(--cream);
    border-radius: 999px;
    padding: 7px 14px;
    font-family: "DM Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: transform 140ms ease, background 140ms ease;
  }
  .pdf-btn:hover { transform: translateY(-1px); background: #fff; }
  .pdf-btn svg { display: block; }

  .pdf-help {
    position: absolute;
    top: calc(100% + 8px);
    right: 16px;
    background: var(--cream);
    color: var(--ink);
    border: 2px solid var(--ink);
    border-radius: 14px;
    padding: 14px 16px 14px 18px;
    max-width: 280px;
    box-shadow: 4px 4px 0 var(--ink);
    font-family: "DM Sans", sans-serif;
    font-size: 13px;
    line-height: 1.5;
    letter-spacing: 0;
    text-transform: none;
    z-index: 20;
  }
  .pdf-help::before {
    content: "";
    position: absolute;
    top: -8px;
    right: 28px;
    width: 12px; height: 12px;
    background: var(--cream);
    border-top: 2px solid var(--ink);
    border-left: 2px solid var(--ink);
    transform: rotate(45deg);
  }
  .pdf-help b { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; display: block; margin-bottom: 4px; font-size: 14px; }
  .pdf-help ol { margin: 6px 0 0 18px; padding: 0; }
  .pdf-help li { margin-bottom: 4px; }
  .pdf-help .x {
    position: absolute; top: 6px; right: 8px;
    background: none; border: none; color: var(--ink-3);
    cursor: pointer; font-size: 16px; font-weight: 500;
    padding: 4px; line-height: 1;
  }

  /* ─── PRINT ─── */
  @page { size: Letter portrait; margin: 0.5in; }
  @media print {
    html, body {
      background: var(--cream) !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    .topbar, .reset, .done-stamp, .celebrate, .twk-panel, .twk-toggle, .pdf-help { display: none !important; }
    .wrap { max-width: 100%; padding: 0; }
    .hero { padding: 8pt 0 14pt; page-break-after: avoid; }
    .hero h1 { font-size: 56pt !important; }
    .hero h1 .amount { box-shadow: 4px 4px 0 var(--ink) !important; }
    .hero .lede { font-size: 14pt !important; }
    .hero .quickfacts { page-break-inside: avoid; }
    .blurb { page-break-inside: avoid; margin-bottom: 18pt !important; padding: 20pt 22pt !important; }
    .section { page-break-before: always; page-break-inside: avoid; box-shadow: 6px 6px 0 var(--ink) !important; margin-bottom: 16pt !important; }
    .section .section-head, .tasks li, .recommend, .alt-funds, .heads { page-break-inside: avoid; }
    .step-badge, .heads { box-shadow: 3px 3px 0 var(--ink) !important; }
    .growth { page-break-before: always; page-break-inside: avoid; padding: 24pt 22pt !important; }
    .growth h2 { font-size: 36pt !important; }
    .age .amt { font-size: 32pt !important; }
    .faq { page-break-before: always; margin-top: 0 !important; }

    .faq details { page-break-inside: avoid; background: var(--cream-2) !important; }
    .faq details summary::after { display: none !important; }
    .faq details p { display: block !important; }
    footer { page-break-inside: avoid; margin-top: 18pt !important; }
  }
